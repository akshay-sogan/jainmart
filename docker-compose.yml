services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: jain_mart
      MYSQL_USER: jain_mart
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local-dev-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./backend
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: jain_mart
      MYSQL_USER: jain_mart
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local-dev-password}
      CORS_ALLOWED_ORIGINS: http://localhost:4200,http://localhost
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  mysql-data:
