<section class="product-manager">
    <div class="manager-intro">
        <span class="eyebrow">Store manager</span>
        <h2>{{ editingProductId ? 'Edit product' : 'Add a product' }}</h2>
        <p>Keep the jain Mart catalog fresh with your own products and prices.</p>
    </div>
    <form class="product-form" (ngSubmit)="saveProduct()">
        <label>
            Product name
            <input type="text" name="productName" [(ngModel)]="productName" placeholder="e.g. Green apples" required />
        </label>
        <label>
            Category
            <input type="text" name="category" [(ngModel)]="category" list="product-categories"
                placeholder="Enter a category" required />
            <datalist id="product-categories">
                <option *ngFor="let option of categories" [value]="option"></option>
            </datalist>
        </label>
        <label>
            Price (Rs.)
            <input type="number" name="price" [(ngModel)]="price" min="1" step="1" placeholder="120" required />
        </label>
        <label>
            Unit
            <select name="unit" [(ngModel)]="unit">
                <option *ngFor="let option of units" [value]="option">{{ option }}</option>
            </select>
        </label>
        <label class="description-field">
            Short description <span>optional</span>
            <input type="text" name="description" [(ngModel)]="description"
                placeholder="A little detail shoppers will appreciate" />
        </label>
        <div class="form-actions">
            <button type="submit" class="manager-submit" [disabled]="saving">
                {{ saving ? 'Saving...' : (editingProductId ? 'Save changes' : 'Add to catalog') }}
            </button>
            <button *ngIf="editingProductId" type="button" class="manager-cancel" [disabled]="saving"
                (click)="cancelEdit()">Cancel</button>
        </div>
    </form>
    <p class="manager-message" *ngIf="message">{{ message }}</p>
</section>
<section class="catalog-manager" aria-label="Product catalog management">
    <h2>Products</h2>
    <p *ngIf="products.length === 0">No products are available to edit.</p>
    <ul *ngIf="products.length > 0">
        <li *ngFor="let product of products">
            <span><strong>{{ product.name }}</strong><small>{{ product.category }} · Rs. {{ product.price }} / {{
                    product.unit }}</small></span>
            <span class="product-actions">
                <button type="button" [disabled]="saving" (click)="editProduct(product)">Edit</button>
                <button type="button" class="delete-product" [disabled]="saving"
                    (click)="deleteProduct(product)">Delete</button>
            </span>
        </li>
    </ul>
</section>
